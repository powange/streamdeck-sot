<!doctype html>
<html>
	<head lang="fr">
		<title>Heure en jeu</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Disposition">
			<sdpi-checkbox setting="textOnTop" label="Texte en haut, image en bas"></sdpi-checkbox>
		</sdpi-item>

		<sdpi-item label="Usage">
			<p>Heure en jeu, moment de la journée et jour du cycle (J1 à J30). Une journée dure 24 minutes réelles : l'heure est calculée à partir de l'horloge du PC, sans connexion. Le titre du bouton remplace le nom du moment de la journée.</p>
		</sdpi-item>
	</body>
</html>
